[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-upstream-synchronizer"
version = "0.1.0"
description = "A Git upstream sync proof of concept orchestrated by Camunda 8"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
git-upstream-sync = "git_upstream_synchronizer.cli:main"
git-upstream-worker = "git_upstream_synchronizer.camunda_worker:main"

[project.optional-dependencies]
dev = ["pytest==9.0.2"]
camunda = ["camunda-orchestration-sdk==9.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
